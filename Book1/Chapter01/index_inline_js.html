<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline JS</title>
</head>

<body>
    <script>
        // prompts are not to be used for the same reason that alerts are not to be used
        // ugly, limited, blocks running of JS
        let personName = prompt('What is your name?');
        alert('Hello, ' + personName);
    </script>
</body>

</html>
