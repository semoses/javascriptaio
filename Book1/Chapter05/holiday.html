<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Finder</title>
</head>

<body>
    <div id="message">Test 1, 2, 3</div>
    <script>
        const dt = new Date(); // Date() is an example of a constructor function
        const month = dt.getMonth();
        let msg; // declare but don't initialize msg here
        switch (month) {
            case 0:
                msg = "January 1 is New Year's Day!";
                break;
            case 1:
                msg = "February 14 is Valentine's Day!"
                break;
            case 2:
                msg = "March 17 is St. Patrick's Day!"
                break;
            case 3:
                msg = "April 1 is April Fool's Day!";
                break;
            case 4:
                msg = "May 26 is Memorial Day!";
                break;
            case 5:
                msg = "June 19th is Juneteenth!";
                break;
            case 6:
                msg = "July 4th is Independence Day!";
                break;
            case 7:
                msg = "August 1st is National Girlfriend's Day!";
                break;
            case 8:
                msg = "September 22 is Rosh Hashanah!";
                break;
            case 9:
                msg = "October 31st is Halloween Day!";
                break;
            case 10:
                msg = "November 28th is Thanksgiving Day!";
                break;
            case 11:
                msg = "December 25th is Christmas Day!";
                break;
            default:
                msg = "No holidays this month."
        }
        const el = document.getElementById('message');
        el.innerHTML = msg;
    </script>
</body>

</html>
